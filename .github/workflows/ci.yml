name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Unit tests need PHPUnit 10 (PHP 8.1+); PHP 7.4 compatibility is checked by
        # lint-php74, PHPStan (phpVersion) and the Shopware 5.6 integration test.
        php: ['8.1', '8.2']

    steps:
      # Third-party actions are pinned to full commit SHAs (supply-chain hardening).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Lint PHP files
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l

      - name: Check XML well-formedness
        run: |
          php -r '
            libxml_use_internal_errors(true);
            $failed = false;
            foreach (["plugin.xml", "Resources/config.xml", "Resources/services.xml"] as $file) {
                if ((new DOMDocument())->load($file) === false) {
                    $failed = true;
                    foreach (libxml_get_errors() as $error) {
                        fwrite(STDERR, $file . ": " . trim($error->message) . PHP_EOL);
                    }
                    libxml_clear_errors();
                }
            }
            exit($failed ? 1 : 0);
          '

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check for known vulnerabilities in dependencies
        run: composer audit

      # Shopware 5 coding standards: php-cs-fixer with the rules of the Shopware core.
      - name: Check coding standard
        if: matrix.php == '8.1'
        run: vendor/bin/php-cs-fixer check --diff --show-progress=none

      - name: Run unit tests
        run: vendor/bin/phpunit

      - name: Build release ZIP
        if: matrix.php == '8.2'
        run: |
          zip_path="$(bin/build-zip.sh)"
          unzip -l "$zip_path"
          if unzip -l "$zip_path" | grep -qE ' Sw5CommunitySecurity/(Tests|bin|vendor)/'; then
              echo "Release ZIP contains development files." >&2
              exit 1
          fi

  # The plugin code runs on PHP 7.4 (Shopware 5.6) as well; tests and tooling need PHP 8.1+.
  lint-php74:
    name: PHP 7.4 syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4'
          coverage: none
          tools: none

      - name: Lint plugin code and integration scripts
        run: git ls-files -z 'Commands/*.php' 'Components/*.php' 'DependencyInjection/*.php' 'Subscriber/*.php' 'Sw5CommunitySecurity.php' 'Tests/Integration/*.php' 'bin/*.php' | xargs -0 -n1 php -l

  static-analysis:
    name: PHPStan (Shopware ${{ matrix.shopware }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shopware: ['5.6.10', '5.7.19', '5.7.20']

    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false

      - name: Checkout Shopware ${{ matrix.shopware }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shopware5/shopware
          ref: v${{ matrix.shopware }}
          path: shopware
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
          extensions: gd, intl, zip, pdo_mysql, mbstring, curl, xml, dom, simplexml, iconv, zlib, openssl

      # Shopware 5.6 is only installed for the analysis (it needs PHP 7.x to run):
      # its lock file predates Composer's allow-plugins, and its platform is PHP 7.
      - name: Install dependencies
        run: |
          if [[ "${{ matrix.shopware }}" == 5.6.* ]]; then
              composer install --no-dev --no-scripts --no-plugins --ignore-platform-reqs --no-interaction --no-progress -d shopware
          else
              composer install --no-dev --no-scripts --no-interaction --no-progress -d shopware
          fi
          composer install --no-interaction --no-progress -d plugin

      - name: Run PHPStan (level max, strict rules)
        working-directory: plugin
        env:
          SHOPWARE_ROOT: ${{ github.workspace }}/shopware
        run: |
          if [[ "${{ matrix.shopware }}" == 5.6.* ]]; then
              vendor/bin/phpstan analyse -c phpstan-sw56.neon.dist --no-progress --memory-limit=2G
          else
              vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress --memory-limit=2G
          fi

      - name: Run PHPStan on tests and tooling
        if: matrix.shopware == '5.7.20'
        working-directory: plugin
        env:
          SHOPWARE_ROOT: ${{ github.workspace }}/shopware
        run: vendor/bin/phpstan analyse -c phpstan-tests.neon.dist --no-progress --memory-limit=2G

  integration:
    name: Shopware ${{ matrix.shopware }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Shopware 5.6.10 with PHP 7.4 (its highest supported PHP version),
        # Shopware 5.7.19/5.7.20 with PHP 8.1 and 8.2.
        include:
          - { shopware: '5.6.10', php: '7.4' }
          - { shopware: '5.7.19', php: '8.1' }
          - { shopware: '5.7.19', php: '8.2' }
          - { shopware: '5.7.20', php: '8.1' }
          - { shopware: '5.7.20', php: '8.2' }

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shopware
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SHOP_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false

      - name: Checkout Shopware ${{ matrix.shopware }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shopware5/shopware
          ref: v${{ matrix.shopware }}
          path: shopware
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: gd, intl, zip, pdo_mysql, mbstring, curl, xml, dom, simplexml, iconv, zlib, openssl
          ini-values: memory_limit=1G

      - name: Install Shopware dependencies
        working-directory: shopware
        # 5.7: same as Shopware's own Makefile, the locked laminas/laminas-code only allows PHP < 8.2.
        # 5.6: the lock file predates Composer's allow-plugins setting.
        run: |
          if [[ "${{ matrix.shopware }}" == 5.6.* ]]; then
              composer config --no-plugins allow-plugins true
              composer install --no-dev --no-interaction --no-progress
              composer config --no-plugins -d recovery/common allow-plugins true
          else
              composer update laminas/laminas-code --no-dev --no-interaction --no-progress
          fi
          composer install --no-dev --no-interaction --no-progress -d recovery/common

      - name: Validate plugin XML against Shopware schemas
        run: php plugin/bin/validate-xml.php shopware

      - name: Install Shopware
        working-directory: shopware
        run: |
          cat > config.php <<'PHP'
          <?php
          return [
              'db' => [
                  'username' => 'root',
                  'password' => 'root',
                  'dbname' => 'shopware',
                  'host' => '127.0.0.1',
                  'port' => '3306',
              ],
          ];
          PHP
          php bin/console sw:database:setup --steps=drop,create,import --no-interaction
          php bin/console sw:cache:clear --no-interaction
          php bin/console sw:database:setup --steps=setupShop --shop-url="${SHOP_URL}" --no-interaction
          php bin/console sw:snippets:to:db --include-plugins --no-interaction
          php bin/console sw:theme:initialize --no-interaction
          php bin/console sw:firstrunwizard:disable --no-interaction
          touch recovery/install/data/install.lock

      - name: Install plugin from release ZIP
        run: |
          zip_path="$(cd plugin && bin/build-zip.sh)"
          unzip -q "plugin/${zip_path}" -d shopware/custom/plugins
          cd shopware
          php bin/console sw:plugin:refresh --no-interaction
          php bin/console sw:plugin:install --activate Sw5CommunitySecurity --no-interaction
          php bin/console sw:cache:clear --no-interaction

      - name: Run integration tests
        run: |
          # Throwaway backend user for this CI run only, with a random password.
          export SW_ADMIN_USER=ci-admin
          SW_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::${SW_ADMIN_PASSWORD}"
          export SW_ADMIN_PASSWORD
          (cd shopware && php bin/console sw:admin:create --name="CI Admin" --email=ci-admin@example.org \
              --username="${SW_ADMIN_USER}" --password="${SW_ADMIN_PASSWORD}" --locale=de_DE --no-interaction)
          SW_TEST_MAIL_ID="$(php <<'PHP'
          <?php
          $db = new PDO('mysql:host=127.0.0.1;port=3306;dbname=shopware', 'root', 'root');
          echo $db->query("SELECT id FROM s_core_config_mails WHERE name = 'sORDER'")->fetchColumn();
          PHP
          )"
          export SW_TEST_MAIL_ID
          plugin/bin/integration-test.sh shopware 8000 "${RUNNER_TEMP}/server.log"

      - name: Show logs on failure
        if: failure()
        run: |
          cat "${RUNNER_TEMP}/server.log" || true
          tail -n 200 shopware/var/log/*.log || true
